name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Provide placeholder Google services configuration
        working-directory: android
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("app/google-services.json")
          path.write_text(json.dumps({
              "project_info": {
                  "project_number": "123456789",
                  "project_id": "weight-bet-ci",
                  "storage_bucket": "weight-bet-ci.appspot.com"
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:123456789:android:ci",
                      "android_client_info": {"package_name": "com.weightloss.betting"}
                  },
                  "api_key": [{"current_key": "AIzaSyCIPlaceholderForBuildOnly"}],
                  "oauth_client": []
              }],
              "configuration_version": "1"
          }))
          PY

      - name: Compile debug Kotlin
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon
