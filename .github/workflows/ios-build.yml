name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Print build environment
        run: |
          sw_vers
          xcodebuild -version
          ruby --version
          gem --version

      - name: Install CocoaPods
        run: sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Print CocoaPods version
        run: pod --version

      - name: Install pods
        working-directory: ios
        run: perl -e 'alarm 600; exec @ARGV' -- pod install --no-repo-update --verbose

      - name: Build iOS simulator target
        working-directory: ios
        run: |
          perl -e 'alarm 900; exec @ARGV' -- xcodebuild \
            -workspace WeightLossBetting.xcworkspace \
            -scheme WeightLossBetting \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -resultBundlePath build/WeightLossBetting.xcresult \
            -showBuildTimingSummary \
            build

      - name: Upload Xcode result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult-${{ github.run_id }}
          path: ios/build/WeightLossBetting.xcresult
          if-no-files-found: ignore
