name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Print build environment
        run: |
          sw_vers
          xcodebuild -version
          ruby --version
          gem --version

      - name: Install CocoaPods
        run: sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Print CocoaPods version
        run: pod --version

      - name: Install pods
        working-directory: ios
        run: pod install --no-repo-update --verbose

      - name: Build iOS simulator target
        working-directory: ios
        run: |
          xcodebuild \
            -workspace WeightLossBetting.xcworkspace \
            -scheme WeightLossBetting \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
